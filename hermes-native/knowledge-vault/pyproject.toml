[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-vault"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
knowledge-vault-publisher = "knowledge_vault.publisher:main"
knowledge-vault-review = "knowledge_vault.review:main"

[tool.setuptools]
package-dir = {"" = "src"}
