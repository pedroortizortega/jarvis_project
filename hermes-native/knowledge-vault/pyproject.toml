[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-vault"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
knowledge-vault-propose = "knowledge_vault.propose:main"
knowledge-vault-search = "knowledge_vault.search:main"
knowledge-vault-decide = "knowledge_vault.decide:main"
knowledge-vault-pending = "knowledge_vault.decide:list_main"
knowledge-vault-search-serve = "knowledge_vault.serve:main"
knowledge-vault-promote = "knowledge_vault.promote:main"
knowledge-vault-promote-check = "knowledge_vault.promote:check_main"
knowledge-vault-sync = "knowledge_vault.sync:main"

[tool.setuptools]
package-dir = {"" = "src"}
