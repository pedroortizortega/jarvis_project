[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-router"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
memory-router = "memory_router.app:main"
memory-router-mcp = "memory_router.app:mcp_main"

[project.entry-points."memory_router.backends"]
engram = "memory_router.backends.engram:EngramBackend"
hindsight = "memory_router.backends.hindsight:HindsightBackend"
honcho = "memory_router.backends.honcho:HonchoBackend"

[tool.setuptools]
package-dir = {"" = "src"}
