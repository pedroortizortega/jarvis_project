apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-shim
  namespace: llms
  labels:
    app.kubernetes.io/name: codex-shim
    app.kubernetes.io/part-of: gpu-handoff-web-panel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: codex-shim
  template:
    metadata:
      labels:
        app: codex-shim
        app.kubernetes.io/name: codex-shim
        app.kubernetes.io/part-of: gpu-handoff-web-panel
    spec:
      serviceAccountName: codex-shim
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: codex-shim
          image: codex-shim:local
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /tmp
            - name: CODEX_SHIM_AUTH_SECRET_NAME
              value: codex-shim-auth
            - name: CODEX_SHIM_NAMESPACE
              value: llms
            - name: CODEX_CLOUD_MODEL
              value: gpt-5.1-codex
            - name: CODEX_SHIM_INTERNAL_KEY
              valueFrom:
                secretKeyRef:
                  name: codex-shim-key
                  key: internal-key
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
