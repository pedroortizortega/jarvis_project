apiVersion: v1
kind: Service
metadata:
  name: codex-shim
  namespace: llms
  labels:
    app.kubernetes.io/name: codex-shim
    app.kubernetes.io/part-of: gpu-handoff-web-panel
spec:
  # Cluster-internal only — no Ingress. This service sits in LiteLLM's
  # request path and never needs LAN exposure of its own.
  type: ClusterIP
  selector:
    app: codex-shim
  ports:
    - name: http
      port: 8080
      targetPort: http
