apiVersion: apps/v1
kind: Deployment
metadata:
  name: engram-postgres
  namespace: engram
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: engram-postgres
  template:
    metadata:
      labels:
        app: engram-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16.4-bookworm
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: engram_cloud
            - name: POSTGRES_USER
              value: engram
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: engram-postgres-auth
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: engram-postgres-data
