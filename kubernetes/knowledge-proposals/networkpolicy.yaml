# networkpolicy.yaml
# Default-deny for the proposal API, then narrow allows. The host outbox and
# publisher run on the node (systemd), so their traffic arrives from the node
# address — confirm 192.168.1.0/24 matches the trantor LAN before applying.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-knowledge-proposals
  namespace: knowledge-proposals
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-host-proposal-clients
  namespace: knowledge-proposals
spec:
  podSelector:
    matchLabels:
      app: knowledge-proposals-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.168.1.0/24
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-knowledge-proposals-dns
  namespace: knowledge-proposals
spec:
  podSelector:
    matchLabels:
      app: knowledge-proposals-api
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
