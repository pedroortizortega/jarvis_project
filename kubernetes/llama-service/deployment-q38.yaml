apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server-q3-8
  namespace: llms
spec:
  # Safe default: never run this beside vLLM or the IQ4 llama-server on one GPU.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-server-q3-8
  template:
    metadata:
      labels:
        app: llama-server-q3-8
        app.kubernetes.io/name: llama-server
        app.kubernetes.io/instance: qwen3.8-27b-ud-iq2-s
        app.kubernetes.io/part-of: local-llm-platform
    spec:
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      enableServiceLinks: false
      priorityClassName: llm-priority
      terminationGracePeriodSeconds: 120
      nodeSelector:
        workload: llm
      tolerations:
        - key: dedicated
          operator: Equal
          value: llm
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10156@sha256:4c0ece468721077a8bff8c114f8b0a92a8604ed310c91939fadfe37595a53b9e
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - /models/Qwen3.8-27B-UD-IQ2_S.gguf
            - --alias
            - qwen3.8-27b-iq2s
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --api-key-file
            - /run/secrets/llama/api-key
            - --n-gpu-layers
            - auto
            - --fit
            - "on"
            - --fit-target
            - "2048"
            - --ctx-size
            - "300000"
            - --parallel
            - "2"
            - --threads
            - "16"
            - --threads-batch
            - "24"
            - --flash-attn
            - auto
            - --cache-type-k
            - q8_0
            - --cache-type-v
            - q8_0
            - --kv-offload
            - --load-mode
            - mmap
            - --cont-batching
            - --cache-prompt
            - --cache-ram
            - "2048"
            - --ctx-checkpoints
            - "12"
            - --jinja
            - --metrics
            - --no-ui
            - --ubatch-size
            - "256"
            - --cache-reuse
            - "256"
            - --kv-unified
            - --reasoning
            - "auto"
            - --reasoning-budget
            - "15000"
            - --top-p
            - "0.9"
            - --temp
            - "0.6"
          env:
            - name: HOME
              value: /tmp
            - name: CUDA_CACHE_PATH
              value: /tmp/cuda-cache
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "12"
              memory: 32Gi
            limits:
              cpu: "24"
              memory: 44Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 240
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: auth
              mountPath: /run/secrets/llama
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-models-q3-8
        - name: tmp
          emptyDir: {}
        - name: auth
          secret:
            secretName: litellm-auth
            items:
              - key: llama-api-key
                path: api-key
            defaultMode: 0440
