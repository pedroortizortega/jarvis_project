apiVersion: batch/v1
kind: Job
metadata:
  name: download-qwen35-9b-q6-k
  namespace: llms
  labels:
    app: llama-model-download-daily
    model.huggingface.co/source: hub
    model.huggingface.co/base-model-official: "true"
  annotations:
    model.huggingface.co/repository: unsloth/Qwen3.5-9B-GGUF
    model.huggingface.co/base-model: Qwen/Qwen3.5-9B
    model.huggingface.co/revision: 3885219b6810b007914f3a7950a8d1b469d598a5
    model.huggingface.co/tags: base_model:Qwen/Qwen3.5-9B,base_model:quantized:Qwen/Qwen3.5-9B
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 10800
  template:
    metadata:
      labels:
        app: llama-model-download-daily
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        workload: llm
      tolerations:
        - key: dedicated
          operator: Equal
          value: llm
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: download
          image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu

              target="/models/Qwen3.5-9B-Q6_K.gguf"
              partial="${target}.partial"
              expected_size="7458301152"
              expected_sha="91898433cf5ce0a8f45516a4cc3e9343b6e01d052d01f684309098c66a326c59"
              url="https://huggingface.co/unsloth/Qwen3.5-9B-GGUF/resolve/3885219b6810b007914f3a7950a8d1b469d598a5/Qwen3.5-9B-Q6_K.gguf?download=true"

              if [ -f "$target" ] &&
                 [ "$(wc -c < "$target" | tr -d ' ')" = "$expected_size" ] &&
                 echo "$expected_sha  $target" | sha256sum -c -; then
                echo "Model already present and verified."
                exit 0
              fi

              rm -f "$target" "$partial"
              curl --fail --location --retry 5 --retry-all-errors \
                --connect-timeout 30 --output "$partial" "$url"

              test "$(wc -c < "$partial" | tr -d ' ')" = "$expected_size"
              echo "$expected_sha  $partial" | sha256sum -c -
              mv "$partial" "$target"
              echo "$expected_sha  $target" | sha256sum -c -
              echo "$expected_sha  $(basename "$target")" > "${target}.sha256"
              echo "Model downloaded and verified: $target"
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-models-daily
