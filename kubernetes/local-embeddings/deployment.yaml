apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-embeddings
  namespace: llms
  labels:
    app.kubernetes.io/name: local-embeddings
    app.kubernetes.io/part-of: local-llm-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: local-embeddings
  template:
    metadata:
      labels:
        app: local-embeddings
        app.kubernetes.io/name: local-embeddings
        app.kubernetes.io/part-of: local-llm-platform
    spec:
      serviceAccountName: local-embeddings
      # D-04: this service needs no Kubernetes API access at all.
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: local-embeddings
          image: local-embeddings:local
          imagePullPolicy: IfNotPresent
          env:
            # D-03: the model is baked into the image (see Dockerfile);
            # these vars force a loud startup failure instead of a silent
            # network fetch if the baked cache is ever missing.
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            # HOME/XDG_CACHE_HOME point at the /tmp emptyDir so any stray
            # write from fastembed/HF lands there, not on the read-only
            # root filesystem.
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp
            # D-14: cap ORT intra-op threads to match the CPU limit below —
            # otherwise ORT spawns one thread per host core and gets
            # CFS-throttled into worse latency than single-threaded.
            - name: OMP_NUM_THREADS
              value: "3"
            - name: ORT_INTRA_OP_NUM_THREADS
              value: "3"
          ports:
            - name: http
              containerPort: 8080
          resources:
            # D-14 (revised 2026-08-22): the pinned model is
            # intfloat/multilingual-e5-large (~2.24GB fp32 ONNX,
            # ~560M params — multilingual-e5-small does not exist in
            # fastembed, only discovered by actually building the
            # image). Sized for that resident model plus
            # interpreter/tokenizer/ORT arena headroom on a 256-item
            # batch. Node has 32 cores / 64GB with 13% utilization at
            # the time of sizing — comfortable headroom either way;
            # revisit under real load.
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              cpu: "3"
              memory: 6Gi
          # D-13: cold-loading ~2.2GB of ONNX on a CPU node takes tens of
          # seconds; without a startupProbe the tight liveness settings
          # below would CrashLoop the pod before it ever became ready.
          # failureThreshold bumped 30->60 (150s->300s budget) alongside
          # the 2026-08-22 model-size correction (e5-small ~500MB ->
          # e5-large ~2.24GB, ~4.7x) — verified loading in a few seconds
          # on this cluster's 32-core node, but a slower/contended node
          # deserves the extra margin rather than trusting one fast run.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
