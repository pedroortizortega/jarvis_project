apiVersion: v1
kind: Service
metadata:
  name: local-embeddings
  namespace: llms
  labels:
    app.kubernetes.io/name: local-embeddings
    app.kubernetes.io/part-of: local-llm-platform
spec:
  # Cluster-internal only — no Ingress. Consumers (memory-router and
  # friends) live in-cluster; this service never needs LAN/WAN exposure.
  type: ClusterIP
  selector:
    app: local-embeddings
  ports:
    - name: http
      port: 8080
      targetPort: http
