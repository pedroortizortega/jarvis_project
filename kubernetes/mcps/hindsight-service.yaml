# hindsight — SDD change: hindsight-deployment (PR 1)
# ClusterIP only, deliberately. No Ingress object exists for Hindsight
# anywhere in this repo — in-cluster consumer (memory-router) only, per the
# proposal's "no Ingress or external exposure" scope decision.
apiVersion: v1
kind: Service
metadata:
  name: hindsight
  namespace: mcps
  labels:
    app: hindsight
spec:
  type: ClusterIP
  ports:
    - port: 8888
      targetPort: 8888
      name: http
  selector:
    app: hindsight
