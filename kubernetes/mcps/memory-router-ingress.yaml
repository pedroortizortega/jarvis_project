# memory-router — Phase 1 deployment manifest (SDD change: memory-router)
# Namespace-ownership blocker resolved, see specs/014_memory_router.md §8.
#
# Tailnet-only, mTLS-terminated at Traefik. Uses its own entryPoint
# (`memoryrouter`, :8444 — see traefik-memoryrouter-entrypoint.yaml) AND
# its own hostname (`memory-router.trantor.tail07dff9.ts.net`) instead of
# sharing `engram-tailnet`'s Host (`trantor.tail07dff9.ts.net`, spec 011
# §1). Live-verified: a dedicated entryPoint alone is NOT enough — Traefik
# resolves the TLS server certificate by SNI (hostname) against one
# global store shared across every entryPoint on the instance, so two
# IngressRoutes on the same Host still collide on which certificate (and
# therefore which TLSOption/client CA) gets served, regardless of port.
# Only a distinct hostname gives memory-router its own SNI slot, which is
# what actually isolates its client CA / mTLS policy from Engram's.
#
# MagicDNS doesn't resolve subdomains by default, so clients need a manual
# /etc/hosts entry pointing this hostname at the cluster's LB VIP — same
# manual-onboarding pattern spec 011 already uses for remote clients:
#   <VIP, e.g. 192.168.1.240>  memory-router.trantor.tail07dff9.ts.net
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: memory-router-tailnet
  namespace: mcps
spec:
  entryPoints:
    - memoryrouter
  routes:
    - match: Host(`memory-router.trantor.tail07dff9.ts.net`)
      kind: Rule
      services:
        - name: memory-router
          port: 8080
  tls:
    options:
      name: mcps-memory-router-mtls
      namespace: mcps
    secretName: memory-router-server-tls
