apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-panel
  namespace: llms
  labels:
    app.kubernetes.io/name: model-panel
    app.kubernetes.io/part-of: gpu-handoff-web-panel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: model-panel
  template:
    metadata:
      labels:
        app: model-panel
        app.kubernetes.io/name: model-panel
        app.kubernetes.io/part-of: gpu-handoff-web-panel
    spec:
      serviceAccountName: model-panel
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: model-panel
          image: model-panel:local
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /tmp
            - name: MODEL_PANEL_NAMESPACE
              value: llms
            - name: MODEL_PANEL_STATE_CONFIGMAP
              value: model-panel-state
            - name: CODEX_SHIM_BASE_URL
              value: http://codex-shim.llms.svc.cluster.local:8080/v1
            - name: CODEX_CLOUD_MODEL
              value: gpt-5.6-sol
            - name: LLAMA_ROUTER_BASE_URL
              value: http://llama-router.llms.svc.cluster.local:8080/v1
            - name: NODE_EXPORTER_BASE_URL
              value: http://node-exporter.llms.svc.cluster.local:9100
            - name: GPU_EXPORTER_BASE_URL
              value: http://nvidia-gpu-exporter.llms.svc.cluster.local:9835
            - name: MODEL_PANEL_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: model-panel-auth
                  key: bearer
            - name: HERMES_WEBHOOK_URL
              value: http://hermes.llms.svc.cluster.local:8000/webhooks/model-panel-session-alerts
            - name: MODEL_PANEL_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: model-panel-webhook
                  key: secret
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: 128Mi
            limits:
              cpu: "500m"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
