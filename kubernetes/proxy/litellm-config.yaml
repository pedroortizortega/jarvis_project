# litellm-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: llms
data:
  litellm_callbacks.py: |
    from fastapi import HTTPException
    from litellm.integrations.custom_logger import CustomLogger

    MODEL_NAMES = {
        "qwen3.5-9b",
        "openai/qwen3.5-9b",
        "llama-cpp-qwen35-9b-q6",
        "qwen3.6-27b",
        "openai/qwen3.6-27b",
        "llama-cpp-qwen36-27b",
        "qwen3.6-27b-q3",
        "openai/qwen3.6-27b-q3",
        "llama-cpp-qwen36-27b-q3",
        "qwen3.6-27b-q6",
        "openai/qwen3.6-27b-q6",
        "llama-cpp-qwen36-27b-q6",
    }
    MAX_OUTPUT_TOKENS = 16_384
    TOKEN_FIELDS = (
        "max_tokens",
        "max_completion_tokens",
        "max_output_tokens",
        "n_predict",
    )
    MAX_OUTPUT_CALL_TYPES = {"responses", "aresponses"}
    MAX_TOKENS_CALL_TYPES = {
        "completion",
        "acompletion",
        "text_completion",
        "atext_completion",
        "anthropic_messages",
        "aanthropic_messages",
        "messages",
        "amessages",
    }


    def cap_tokens(value, field):
        if value is None:
            return MAX_OUTPUT_TOKENS
        if isinstance(value, bool) or not isinstance(value, int) or value < 1:
            raise HTTPException(status_code=400, detail=f"Invalid {field}")
        return min(value, MAX_OUTPUT_TOKENS)


    def cap_container(container):
        has_limit = False
        for field in TOKEN_FIELDS:
            if field in container:
                container[field] = cap_tokens(container[field], field)
                has_limit = True
        return has_limit


    class MaxOutputTokensCap(CustomLogger):
        async def async_pre_call_hook(
            self, user_api_key_dict, cache, data, call_type
        ):
            if data.get("model") not in MODEL_NAMES:
                return data

            has_limit = cap_container(data)
            extra_body = data.get("extra_body")
            if extra_body is not None:
                if not isinstance(extra_body, dict):
                    raise HTTPException(status_code=400, detail="Invalid extra_body")
                has_limit = cap_container(extra_body) or has_limit

            if not has_limit:
                if call_type in MAX_OUTPUT_CALL_TYPES:
                    data["max_output_tokens"] = MAX_OUTPUT_TOKENS
                elif call_type in MAX_TOKENS_CALL_TYPES:
                    data["max_tokens"] = MAX_OUTPUT_TOKENS
            return data


    max_output_tokens_cap = MaxOutputTokensCap()

  config.yaml: |
    model_list:
      - model_name: qwen3
        litellm_params:
          model: openai/qwen3   # vLLM expone API OpenAI-compatible; "openai/" le dice a LiteLLM que use ese protocolo
          api_base: http://vllm.llms.svc.cluster.local:8000/v1
          api_key: "not-needed"  # vLLM no exige key interna; la seguridad la pone LiteLLM hacia afuera
      - model_name: qwen3.6-27b
        litellm_params:
          # Alias estable del perfil grande Q3; el router descarga el 9B antes de cargarlo.
          model: openai/qwen3.6-27b-q3
          api_base: http://llama-router.llms.svc.cluster.local:8080/v1
          api_key: os.environ/LLAMA_API_KEY
        model_info:
          id: llama-cpp-qwen36-27b
          mode: chat
          max_tokens: 65536
          max_input_tokens: 49152
          max_output_tokens: 16384
      - model_name: qwen3.6-27b-q3
        litellm_params:
          model: openai/qwen3.6-27b-q3
          api_base: http://llama-router.llms.svc.cluster.local:8080/v1
          api_key: os.environ/LLAMA_API_KEY
        model_info:
          id: llama-cpp-qwen36-27b-q3
          mode: chat
          max_tokens: 65536
          max_input_tokens: 49152
          max_output_tokens: 16384
      - model_name: qwen3.6-27b-q6
        litellm_params:
          model: openai/qwen3.6-27b-q6
          # Solo se activa despues de detener vLLM y cualquier otro llama-server GPU.
          api_base: http://llama-server-q6.llms.svc.cluster.local:8080/v1
          api_key: os.environ/LLAMA_API_KEY
        model_info:
          id: llama-cpp-qwen36-27b-q6
          mode: chat
          max_tokens: 65536
          max_input_tokens: 49152
          max_output_tokens: 16384
      - model_name: qwen3.5-9b
        litellm_params:
          model: openai/qwen3.5-9b
          api_base: http://llama-router.llms.svc.cluster.local:8080/v1
          api_key: os.environ/LLAMA_API_KEY
        model_info:
          id: llama-cpp-qwen35-9b-q6
          mode: chat
          max_tokens: 65536
          max_input_tokens: 49152
          max_output_tokens: 16384
      - model_name: cloud
        litellm_params:
          # codex-shim posee la sesion OAuth de Codex y traduce Chat Completions <-> Responses API (D15).
          model: openai/gpt-5.1-codex
          api_base: http://codex-shim.llms.svc.cluster.local:8080/v1
          api_key: os.environ/CODEX_SHIM_KEY
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      # Este proxy no usa virtual keys ni Postgres. El master key funciona sin DB y debe fallar cerrado.
      allow_requests_on_db_unavailable: false
    litellm_settings:
      drop_params: true      # Hermes manda `reasoning_effort`; vLLM/qwen3 no lo soporta y sin esto litellm devuelve 400 en vez de ignorarlo
      modify_params: true
      callbacks:
        - litellm_callbacks.max_output_tokens_cap
    router_settings:
      enable_pre_call_checks: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: llms
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector: {matchLabels: {app: litellm}}
  template:
    metadata: {labels: {app: litellm}}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        workload: llm
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.93.0@sha256:a1745e629abfb17d434426ff48b115f54f4f4c4a0f5af241de569e93c63c411e
          args: ["--config", "/config/config.yaml"]
          ports: [{name: http, containerPort: 4000}]
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-auth
                  key: master-key
            - name: LLAMA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-auth
                  key: llama-api-key
            - name: CODEX_SHIM_KEY
              valueFrom:
                secretKeyRef:
                  name: codex-shim-key
                  key: internal-key
            - name: LITELLM_MODE
              value: PRODUCTION
            - name: PYTHONPATH
              value: /config
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
      volumes:
        - name: config
          configMap: {name: litellm-config}
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: llms
spec:
  selector: {app: litellm}
  ports: [{port: 4000, targetPort: 4000}]
  type: LoadBalancer   # MetalLB le asignará una IP del pool (ej. 192.168.1.240)
